services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Uncomment to use an NVIDIA GPU (needs nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  # One-shot: pulls the models the orchestrator needs, then exits.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${MODEL_NAME:-llama3.2} && ollama pull nomic-embed-text"]

  orchestrator:
    build: .
    image: enterprise-ai-orchestrator
    ports:
      - "8000:8000"
    environment:
      OLLAMA_HOST: http://ollama:11434
      CHROMA_PATH: /data/chroma
      MODEL_NAME: ${MODEL_NAME:-llama3.2}
    volumes:
      - chroma-data:/data/chroma
    depends_on:
      ollama-init:
        condition: service_completed_successfully

volumes:
  ollama-models:
  chroma-data:
